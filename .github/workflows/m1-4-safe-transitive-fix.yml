name: M1.4 Safe Transitive Fix

on:
  push:
    branches:
      - milestone-1/foundation
    paths:
      - '.github/workflows/m1-4-safe-transitive-fix.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:5432/audit?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: milestone-1/foundation

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Apply non-breaking transitive security fixes
        run: npm audit fix --package-lock-only || true

      - name: Verify production critical gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No safe transitive updates remain."
            exit 0
          fi
          git commit -m "fix(m1.4): apply safe transitive security updates"
          git push origin HEAD:milestone-1/foundation
