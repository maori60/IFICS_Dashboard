name: Harden V1 dependencies

on:
  push:
    branches: [project-completion/v1]
    paths:
      - .github/workflows/dependency-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build_only:unused@127.0.0.1:5432/build_only?schema=public
      NODE_ENV: development
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      IP_HASH_PEPPER: dependency-hardening-development-pepper
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-completion/v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Upgrade vulnerable packages
        run: |
          npm install --save nodemailer@10.0.1
          npm uninstall --save-dev @types/nodemailer
          npm pkg set overrides.deepmerge-ts=8.0.2
          npm pkg set overrides.mysql2=3.24.3
          npm install
          npm pkg set 'scripts.security:audit=npm audit --omit=dev --audit-level=high'
      - name: Validate hardened dependency graph
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run security:audit
          npm run build
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/dependency-hardening.yml
      - name: Commit validated dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-hardening.yml
          git commit -m "chore(security): remediate high severity dependency advisories"
          git push origin HEAD:project-completion/v1
