name: Build V1 schema migration

on:
  push:
    branches: [project-completion/v1]
    paths:
      - scripts/extend-v1-security-schema.mjs
      - .github/workflows/v1-schema-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ifics_v1
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ifics_shadow
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-completion/v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create validation databases
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres ifics_v1
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres ifics_shadow
      - name: Extend V1 schema
        run: node scripts/extend-v1-security-schema.mjs
      - name: Format and validate schema
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
      - name: Generate catch-up migration from migration history
        run: |
          rm -f /tmp/platform_v1.sql
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --script \
            --output /tmp/platform_v1.sql
          test -s /tmp/platform_v1.sql
          mkdir -p prisma/migrations/20260908010000_platform_v1
          mv /tmp/platform_v1.sql prisma/migrations/20260908010000_platform_v1/migration.sql
      - name: Apply full migration history on clean PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify database and Prisma schema are in sync
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Verify application still typechecks
        run: npm run typecheck
      - name: Remove one-shot migration machinery
        run: rm -f scripts/extend-v1-security-schema.mjs .github/workflows/v1-schema-migration.yml
      - name: Commit validated schema and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No schema changes to commit"
            exit 0
          fi
          git commit -m "feat(schema): finalize V1 security and operations model"
          git push origin HEAD:project-completion/v1
