name: M1.4 Final Lock Sync

on:
  push:
    branches:
      - milestone-1/foundation
    paths:
      - '.github/workflows/m1-4-final-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://audit:audit@127.0.0.1:5432/audit?schema=public

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: milestone-1/foundation

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git commit -m "chore(m1.4): sync final dependency classification"
          git push origin HEAD:milestone-1/foundation
