name: Expand Domain Schema

on:
  push:
    branches: [project-completion/v1]
    paths: ['.github/workflows/schema-expand.yml']

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build_only:unused@127.0.0.1:5432/build_only?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-completion/v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Append remaining IFICS domain models
        run: |
          if grep -q 'model SupportTicket' prisma/schema.prisma; then exit 0; fi
          cat >> prisma/schema.prisma <<'EOF'

// -----------------------------------------------------------------------------
// Extended IFICS modules: support, CMS, CRM, R&D, IT, HR and public publication
// These modules deliberately use association-scoped scalar references to keep
// the core identity/project schema stable while preserving clear module bounds.
// Service-layer authorization validates referenced resources before writes.
// -----------------------------------------------------------------------------

enum TicketStatus { NEW IN_PROGRESS WAITING_REQUESTER RESOLVED CLOSED }
enum TicketPriority { LOW NORMAL HIGH URGENT }
enum TicketCategory { ADMIN BILLING CONTRACT PROJECT PLATFORM DOCUMENT IT HR SECURITY OTHER }
enum ContentKind { PAGE ARTICLE NEWS RND ACTIVITY_REPORT }
enum ContentStatus { DRAFT REVIEW APPROVED SCHEDULED PUBLISHED ARCHIVED }
enum PartnerType { INSTITUTIONAL COLLECTIVITY COMPANY PATRON OPERATIONAL TECHNICAL }
enum PartnerPipelineStage { IDENTIFIED CONTACTED MEETING PROPOSAL NEGOTIATION WON LOST }
enum ProposalStatus { NEW QUALIFYING CONTACTED STUDY NEGOTIATION ACCEPTED REJECTED CONVERTED }
enum JobStatus { DRAFT PUBLISHED CLOSED ARCHIVED }
enum ApplicationStatus { NEW REVIEW INTERVIEW ACCEPTED REJECTED ARCHIVED }
enum SoftwareStatus { EXPERIMENTAL BETA STABLE ARCHIVED }
enum TaskStatus { TODO IN_PROGRESS BLOCKED DONE }
enum TaskPriority { LOW NORMAL HIGH URGENT }
enum AssetStatus { STOCK ASSIGNED MAINTENANCE RETIRED LOST }
enum RndStatus { IDEA EXPLORATION PROTOTYPE PILOT ACTIVE ARCHIVED }
enum HrEmploymentType { EMPLOYEE VOLUNTEER INTERN APPRENTICE EXTERNAL }
enum ContactRequestStatus { NEW IN_PROGRESS RESOLVED ARCHIVED }

model SupportTicket {
  id              String         @id @default(cuid())
  associationId   String
  number          String         @db.VarChar(40)
  requesterUserId String?
  requesterEmail  String?        @db.VarChar(255)
  projectId       String?
  category        TicketCategory @default(OTHER)
  priority        TicketPriority @default(NORMAL)
  status          TicketStatus   @default(NEW)
  subject         String         @db.VarChar(255)
  description     String
  assigneeUserId  String?
  resolvedAt      DateTime?
  closedAt        DateTime?
  createdAt       DateTime       @default(now())
  updatedAt       DateTime       @updatedAt
  comments        TicketComment[]
  @@unique([associationId, number])
  @@index([associationId, status, priority])
  @@index([requesterUserId])
  @@index([assigneeUserId])
  @@index([projectId])
}

model TicketComment {
  id           String        @id @default(cuid())
  ticketId     String
  authorUserId String?
  body         String
  internal     Boolean       @default(false)
  attachments Json?
  createdAt    DateTime      @default(now())
  ticket       SupportTicket @relation(fields: [ticketId], references: [id], onDelete: Cascade)
  @@index([ticketId, createdAt])
}

model TicketSequence {
  id            String   @id @default(cuid())
  associationId String
  year          Int
  lastNumber    Int      @default(0)
  updatedAt     DateTime @updatedAt
  @@unique([associationId, year])
}

model CmsEntry {
  id               String        @id @default(cuid())
  associationId    String
  kind             ContentKind
  slug             String        @db.VarChar(180)
  titleFr          String        @db.VarChar(255)
  titleEn          String?       @db.VarChar(255)
  excerptFr        String?
  excerptEn        String?
  bodyFr           String
  bodyEn           String?
  heroImageUrl     String?       @db.VarChar(500)
  gallery          Json?
  status           ContentStatus @default(DRAFT)
  featured         Boolean       @default(false)
  authorUserId     String?
  reviewedByUserId String?
  scheduledAt      DateTime?
  publishedAt      DateTime?
  archivedAt       DateTime?
  createdAt        DateTime      @default(now())
  updatedAt        DateTime      @updatedAt
  @@unique([associationId, kind, slug])
  @@index([associationId, kind, status])
  @@index([publishedAt])
}

model Partner {
  id            String               @id @default(cuid())
  associationId String
  name          String               @db.VarChar(200)
  type          PartnerType
  stage         PartnerPipelineStage @default(IDENTIFIED)
  website       String?              @db.VarChar(500)
  logoUrl       String?              @db.VarChar(500)
  descriptionFr String?
  descriptionEn String?
  publicEnabled Boolean              @default(false)
  notes         String?
  createdAt     DateTime             @default(now())
  updatedAt     DateTime             @updatedAt
  contacts      PartnerContact[]
  interactions  PartnerInteraction[]
  messages      PartnerMessage[]
  @@index([associationId, type])
  @@index([associationId, stage])
}

model PartnerContact {
  id        String   @id @default(cuid())
  partnerId String
  firstName String   @db.VarChar(100)
  lastName  String   @db.VarChar(100)
  jobTitle  String?  @db.VarChar(150)
  email     String?  @db.VarChar(255)
  phone     String?  @db.VarChar(30)
  isPrimary Boolean  @default(false)
  notes     String?
  createdAt DateTime @default(now())
  updatedAt DateTime @updatedAt
  partner   Partner  @relation(fields: [partnerId], references: [id], onDelete: Cascade)
  @@index([partnerId])
}

model PartnerInteraction {
  id           String   @id @default(cuid())
  partnerId    String
  authorUserId String?
  occurredAt   DateTime @default(now())
  kind         String   @db.VarChar(80)
  summary      String
  nextAction   String?
  nextActionAt DateTime?
  createdAt    DateTime @default(now())
  partner      Partner  @relation(fields: [partnerId], references: [id], onDelete: Cascade)
  @@index([partnerId, occurredAt])
  @@index([nextActionAt])
}

model PartnerMessage {
  id           String   @id @default(cuid())
  partnerId    String
  authorUserId String?
  body         String
  internal     Boolean  @default(false)
  createdAt    DateTime @default(now())
  partner      Partner  @relation(fields: [partnerId], references: [id], onDelete: Cascade)
  @@index([partnerId, createdAt])
}

model ProjectPublication {
  id            String   @id @default(cuid())
  associationId String
  projectId     String   @unique
  slug          String   @db.VarChar(180)
  titleFr       String   @db.VarChar(255)
  titleEn       String?  @db.VarChar(255)
  summaryFr     String
  summaryEn     String?
  imageUrl      String?  @db.VarChar(500)
  territory     String?  @db.VarChar(150)
  publicStatus  String?  @db.VarChar(80)
  publicEnabled Boolean  @default(false)
  publishedAt   DateTime?
  createdAt     DateTime @default(now())
  updatedAt     DateTime @updatedAt
  @@unique([associationId, slug])
  @@index([associationId, publicEnabled])
}

model IntervenorPublicProfile {
  id             String   @id @default(cuid())
  associationId  String
  intervenorId   String   @unique
  displayName    String?  @db.VarChar(200)
  bioFr          String?
  bioEn          String?
  photoUrl       String?  @db.VarChar(500)
  skills         String[] @default([])
  languages      String[] @default([])
  certifications String[] @default([])
  links          Json?
  publicEnabled  Boolean  @default(false)
  approvedAt     DateTime?
  approvedByUserId String?
  createdAt      DateTime @default(now())
  updatedAt      DateTime @updatedAt
  @@index([associationId, publicEnabled])
}

model ProjectProposal {
  id              String         @id @default(cuid())
  associationId   String
  organizationName String        @db.VarChar(200)
  contactName     String         @db.VarChar(200)
  email           String         @db.VarChar(255)
  phone           String?        @db.VarChar(30)
  territory       String?        @db.VarChar(150)
  audience        String?
  issue           String
  proposalType    String?        @db.VarChar(150)
  timeframe       String?        @db.VarChar(150)
  budget          Decimal?       @db.Decimal(12, 2)
  participantCount Int?
  comment         String?
  attachmentPath  String?        @db.VarChar(500)
  status          ProposalStatus @default(NEW)
  assignedUserId  String?
  convertedProjectId String?
  createdAt       DateTime       @default(now())
  updatedAt       DateTime       @updatedAt
  @@index([associationId, status])
  @@index([email])
}

model ContactRequest {
  id            String               @id @default(cuid())
  associationId String
  reason        String               @db.VarChar(100)
  name          String               @db.VarChar(200)
  organization  String?              @db.VarChar(200)
  email         String               @db.VarChar(255)
  phone         String?              @db.VarChar(30)
  message       String
  status        ContactRequestStatus @default(NEW)
  assignedUserId String?
  createdAt     DateTime             @default(now())
  updatedAt     DateTime             @updatedAt
  @@index([associationId, status])
}

model JobOpening {
  id            String    @id @default(cuid())
  associationId String
  slug          String    @db.VarChar(180)
  title         String    @db.VarChar(255)
  contractType  String?   @db.VarChar(100)
  location      String?   @db.VarChar(150)
  descriptionFr String
  descriptionEn String?
  status        JobStatus @default(DRAFT)
  publishedAt   DateTime?
  closedAt      DateTime?
  createdAt     DateTime  @default(now())
  updatedAt     DateTime  @updatedAt
  applications  JobApplication[]
  @@unique([associationId, slug])
  @@index([associationId, status])
}

model JobApplication {
  id         String            @id @default(cuid())
  openingId  String
  name       String            @db.VarChar(200)
  email      String            @db.VarChar(255)
  phone      String?           @db.VarChar(30)
  message    String?
  cvPath     String?           @db.VarChar(500)
  status     ApplicationStatus @default(NEW)
  createdAt  DateTime          @default(now())
  updatedAt  DateTime          @updatedAt
  opening    JobOpening        @relation(fields: [openingId], references: [id], onDelete: Cascade)
  @@index([openingId, status])
}

model SoftwareCategory {
  id            String   @id @default(cuid())
  associationId String
  name          String   @db.VarChar(120)
  slug          String   @db.VarChar(120)
  createdAt     DateTime @default(now())
  items         SoftwareItem[]
  @@unique([associationId, slug])
}

model SoftwareItem {
  id            String         @id @default(cuid())
  associationId String
  categoryId    String?
  name          String         @db.VarChar(200)
  slug          String         @db.VarChar(180)
  descriptionFr String
  descriptionEn String?
  audience      String?
  features      Json?
  platforms     String[]       @default([])
  license       String?        @db.VarChar(120)
  openSource    Boolean        @default(false)
  repoUrl       String?        @db.VarChar(500)
  docsUrl       String?        @db.VarChar(500)
  videoUrl      String?        @db.VarChar(500)
  status        SoftwareStatus @default(EXPERIMENTAL)
  publicEnabled Boolean        @default(false)
  downloadCount Int            @default(0)
  createdAt     DateTime       @default(now())
  updatedAt     DateTime       @updatedAt
  category      SoftwareCategory? @relation(fields: [categoryId], references: [id], onDelete: SetNull)
  versions      SoftwareVersion[]
  @@unique([associationId, slug])
  @@index([associationId, status, publicEnabled])
}

model SoftwareVersion {
  id          String         @id @default(cuid())
  softwareId  String
  version     String         @db.VarChar(50)
  changelog   String?
  filePath    String?        @db.VarChar(500)
  sha256      String?        @db.VarChar(64)
  fileSize    BigInt?
  status      SoftwareStatus @default(EXPERIMENTAL)
  publishedAt DateTime?
  createdAt   DateTime       @default(now())
  software    SoftwareItem   @relation(fields: [softwareId], references: [id], onDelete: Cascade)
  @@unique([softwareId, version])
  @@index([softwareId, publishedAt])
}

model RndProject {
  id            String    @id @default(cuid())
  associationId String
  title         String    @db.VarChar(255)
  description   String?
  ownerUserId   String?
  status        RndStatus @default(IDEA)
  budget        Decimal?  @db.Decimal(12, 2)
  repoUrl       String?   @db.VarChar(500)
  documentationUrl String? @db.VarChar(500)
  testResults   String?
  publicEnabled Boolean   @default(false)
  createdAt     DateTime  @default(now())
  updatedAt     DateTime  @updatedAt
  @@index([associationId, status])
}

model WorkTask {
  id            String       @id @default(cuid())
  associationId String
  projectId     String?
  title         String       @db.VarChar(255)
  description   String?
  status        TaskStatus   @default(TODO)
  priority      TaskPriority @default(NORMAL)
  assigneeUserId String?
  dueDate       DateTime?
  createdByUserId String?
  createdAt     DateTime     @default(now())
  updatedAt     DateTime     @updatedAt
  @@index([associationId, status, priority])
  @@index([projectId])
  @@index([assigneeUserId])
}

model Department {
  id            String   @id @default(cuid())
  associationId String
  name          String   @db.VarChar(150)
  code          String   @db.VarChar(50)
  description   String?
  createdAt     DateTime @default(now())
  updatedAt     DateTime @updatedAt
  memberships   DepartmentMembership[]
  @@unique([associationId, code])
}

model DepartmentMembership {
  id           String     @id @default(cuid())
  departmentId String
  userId       String
  position     String?    @db.VarChar(150)
  isManager    Boolean    @default(false)
  createdAt    DateTime   @default(now())
  department   Department @relation(fields: [departmentId], references: [id], onDelete: Cascade)
  @@unique([departmentId, userId])
  @@index([userId])
}

model HrProfile {
  id            String           @id @default(cuid())
  associationId String
  userId        String           @unique
  employmentType HrEmploymentType
  startDate     DateTime?
  endDate       DateTime?
  managerUserId String?
  skills        String[]         @default([])
  notes         String?
  createdAt     DateTime         @default(now())
  updatedAt     DateTime         @updatedAt
  absences      HrAbsence[]
  trainings     HrTraining[]
  reviews       HrReview[]
  @@index([associationId, employmentType])
}

model HrAbsence {
  id        String    @id @default(cuid())
  profileId String
  type      String    @db.VarChar(100)
  startDate DateTime
  endDate   DateTime
  status    String    @default("PENDING") @db.VarChar(40)
  note      String?
  createdAt DateTime  @default(now())
  profile   HrProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
  @@index([profileId, startDate])
}

model HrTraining {
  id          String    @id @default(cuid())
  profileId   String
  title       String    @db.VarChar(255)
  provider    String?   @db.VarChar(200)
  completedAt DateTime?
  expiresAt   DateTime?
  certificatePath String? @db.VarChar(500)
  createdAt   DateTime  @default(now())
  profile     HrProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
  @@index([profileId, expiresAt])
}

model HrReview {
  id             String    @id @default(cuid())
  profileId      String
  reviewerUserId String?
  reviewDate     DateTime
  summary        String
  objectives     String?
  createdAt      DateTime  @default(now())
  profile        HrProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
  @@index([profileId, reviewDate])
}

model Asset {
  id             String      @id @default(cuid())
  associationId  String
  inventoryTag   String      @db.VarChar(100)
  type           String      @db.VarChar(100)
  brand          String?     @db.VarChar(100)
  model          String?     @db.VarChar(150)
  serialNumber   String?     @db.VarChar(150)
  status         AssetStatus @default(STOCK)
  assignedUserId String?
  location       String?     @db.VarChar(200)
  purchaseDate   DateTime?
  warrantyUntil  DateTime?
  notes          String?
  createdAt      DateTime    @default(now())
  updatedAt      DateTime    @updatedAt
  @@unique([associationId, inventoryTag])
  @@index([associationId, status])
  @@index([assignedUserId])
}

model SystemSetting {
  id            String   @id @default(cuid())
  associationId String
  key           String   @db.VarChar(120)
  value         Json
  updatedAt     DateTime @updatedAt
  @@unique([associationId, key])
}
EOF
          npx prisma format
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Commit expanded schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          if ! git diff --cached --quiet; then
            git commit -m "feat(schema): add extended IFICS modules"
            git push origin HEAD:project-completion/v1
          fi
