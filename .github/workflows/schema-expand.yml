name: Expand Domain Schema

on:
  push:
    branches:
      - project-completion/v1
    paths:
      - '.github/workflows/schema-expand.yml'
      - 'scripts/expand-schema.mjs'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build_only:unused@127.0.0.1:5432/build_only?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: project-completion/v1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Expand schema
        run: node scripts/expand-schema.mjs
      - name: Format and validate
        run: |
          npx prisma format
          npx prisma validate
          npx prisma generate
      - name: Commit expanded schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          if ! git diff --cached --quiet; then
            git commit -m "feat(schema): add extended IFICS modules"
            git push origin HEAD:project-completion/v1
          fi
