name: Lockfile Sync

on:
  push:
    branches:
      - milestone-1/foundation
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: milestone-1/foundation

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Show lockfile diff
        run: git diff -- package-lock.json

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize package lock"
          git push origin HEAD:milestone-1/foundation
