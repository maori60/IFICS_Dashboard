services:
  db:
    image: postgres:16-alpine
    container_name: ifics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: van_dashboard
      POSTGRES_PASSWORD: van1234
      POSTGRES_DB: association_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U van_dashboard -d association_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://van_dashboard:van1234@db:5432/association_dashboard?schema=public
    container_name: ifics-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://van_dashboard:van1234@db:5432/association_dashboard?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data: